# Render blueprint for APX AutoMai.
# Render has no native PHP runtime, so the app ships as a Docker image
# (see Dockerfile). The managed Postgres connection details are injected below.
services:
  - type: web
    name: apx-automai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # The name at the top of every email Laravel composes. It defaulted to
      # "Laravel", which is what the shop's customers were being sent.
      #
      # APP_URL is deliberately not here: the service's own hostname is not
      # written down anywhere in this repo and a rename would silently break
      # every link again, so docker-entrypoint.sh takes it from Render's
      # RENDER_EXTERNAL_URL instead. Setting it in the dashboard still wins.
      - key: APP_NAME
        value: APX AutoMai
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: apx-automai-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: apx-automai-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: apx-automai-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: apx-automai-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: apx-automai-db, property: password }
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # Mail. The non-secret settings are pinned here so the deployment is
      # self-documenting; the credentials are marked sync: false, which tells
      # Render to prompt for them in the dashboard rather than keeping them
      # in this file.
      #
      # Brevo on port 2525, deliberately NOT Gmail: since 2025-09-26 Render's
      # free instances drop outbound traffic to ports 25, 465 and 587 at the
      # firewall, so every SMTP provider that only listens on those ports is
      # unreachable here. The failure looks like a connection timeout rather
      # than a rejected login, which makes it easy to misread as bad
      # credentials. Port 2525 is not blocked.
      #
      # Note this app reads MAIL_SCHEME, not MAIL_ENCRYPTION (Laravel 11+).
      # On 2525 it stays unset and STARTTLS is negotiated automatically.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 2525
      - key: MAIL_FROM_NAME
        value: APX AutoMai
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      # Which gateway carries a text. Left at log, the deploy sends no SMS
      # at all — it records every attempt in sms_logs and contacts nobody,
      # which is the right setting until a sender name is approved. Set it
      # to unisms or semaphore here, and give that provider's key below.
      - key: SMS_DRIVER
        value: log
      # UniSMS. Both are prompted for, because neither is useful without
      # the other: UniSMS requires a sender ID on every message.
      - key: UNISMS_BASE_URL
        value: https://unismsapi.com/api
      - key: UNISMS_KEY
        sync: false
      - key: UNISMS_SENDER_ID
        sync: false
      # Semaphore. The key is prompted for in the dashboard; with SEMAPHORE_KEY
      # unset the app simply skips the SMS channel. SEMAPHORE_SENDER_NAME is
      # deliberately not listed: unset, Semaphore uses the sender name
      # registered to the account, which is what we want. That registration is
      # not automatic — an account with no approved sender name cannot send at
      # all, however many credits it holds. Apply once, in their dashboard.
      - key: SEMAPHORE_BASE_URL
        value: https://api.semaphore.co/api/v4
      - key: SEMAPHORE_KEY
        sync: false

databases:
  - name: apx-automai-db
    # Paid, and it has to be. Render's free Postgres expires: ours was due to
    # be suspended on 2026-10-31 and deleted after a grace period, which would
    # have taken every booking with it. Upgraded to the 256MB plan the day
    # before, at roughly USD 6 a month, billed by the hour.
    #
    # Leaving this at "free" was not merely out of date. Render refuses to
    # downgrade a live database, so a sync against this file would fail with
    # "cannot downgrade database from Basic-256mb to Free" and keep failing
    # until the file agreed with the dashboard.
    #
    # 0.1c-256mb is what the dashboard now calls this plan; basic-256mb is the
    # same thing under its old name and is still accepted. diskSizeGB is left
    # out on purpose — an existing database keeps the disk it has, and Render
    # can never shrink storage, so it is not a field to guess at.
    plan: 0.1c-256mb
